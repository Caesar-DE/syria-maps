# /etc/nginx/sites-available/syria-maps — certificates e.g. via certbot.
proxy_cache_path /var/cache/nginx/syria-tiles levels=1:2 keys_zone=syria_tiles:50m max_size=2g inactive=7d;

server {
    listen 80;
    server_name maps.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name maps.example.org;

    ssl_certificate     /etc/letsencrypt/live/maps.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maps.example.org/privkey.pem;

    location /tiles/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_cache syria_tiles;
        proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
