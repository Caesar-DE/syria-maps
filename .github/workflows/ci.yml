name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: syria_maps
          POSTGRES_PASSWORD: syria_maps
          POSTGRES_DB: syria_maps_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U syria_maps" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate layer definitions and datasets
        run: |
          python -m app.cli validate-layers
          python -m app.cli validate-dataset ../database/fixtures/*.geojson
      - name: Tests (unit + PostGIS integration)
        env:
          TEST_DATABASE_URL: postgresql://syria_maps:syria_maps@localhost:5432/syria_maps_test
        run: pytest -q
      - name: Build and validate the OsmAnd package
        run: |
          python -m app.cli build-osf --storage memory \
            --base-url "${{ vars.SYRIA_MAPS_PUBLIC_BASE_URL || 'https://maps.example.org' }}" \
            --output ../dist/syria-maps.osf
          python -m app.cli validate-osf ../dist/syria-maps.osf
      - uses: actions/upload-artifact@v4
        with:
          name: syria-maps-osf
          path: dist/syria-maps.osf

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Health and data checks
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/health && break; sleep 2; done
          curl -fsS http://localhost:8000/health
          curl -fsS "http://localhost:8000/api/v1/public-services?limit=1" | grep -q '"numberMatched":48'
          curl -fsS -o /dev/null http://localhost:8000/tiles/public-services/12/2459/1643.png
          curl -fsS -o syria-maps.osf http://localhost:8000/osmand/syria-maps.osf
      - if: failure()
        run: docker compose logs
      - run: docker compose down -v

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, debug APK, release APK/AAB (debug-signed without keystore), lint
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease bundleRelease lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: syria-maps-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
